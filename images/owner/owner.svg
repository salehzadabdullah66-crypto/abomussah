<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf953f" />
      <stop offset="50%" stop-color="#b38728" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#darkBg)"/>
  <!-- Decorative Frame Accent -->
  <rect x="20" y="20" width="560" height="660" fill="none" stroke="url(#gold)" stroke-width="4" rx="16"/>
  
  <!-- Silhouette for Owner Placeholder -->
  <circle cx="300" cy="280" r="110" fill="#262626" stroke="url(#gold)" stroke-width="3"/>
  <path d="M 140 600 C 140 430, 460 430, 460 600 Z" fill="#262626" stroke="url(#gold)" stroke-width="3"/>
  
  <text x="300" y="290" font-family="'Cairo', sans-serif" font-weight="900" font-size="32" fill="url(#gold)" text-anchor="middle">صورة أبو موسى</text>
  <text x="300" y="330" font-family="'Cairo', sans-serif" font-weight="600" font-size="18" fill="#b3b3b3" text-anchor="middle">(مالك المعرض)</text>
  <text x="300" y="650" font-family="'Cairo', sans-serif" font-weight="800" font-size="20" fill="url(#gold)" text-anchor="middle">أبو موسى... لديكم لا خوف عليكم</text>
</svg>
